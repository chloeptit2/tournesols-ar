<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Les tournesols – réalité augmentée</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif}
#hint{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:10;text-align:center;pointer-events:none;transition:opacity .3s}
#hint span{display:inline-block;background:rgba(0,0,0,.55);color:#fff;padding:10px 18px;border-radius:20px;font-size:16px}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#F4EFE6;z-index:15;display:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;background:#1b1b1b;z-index:20}</style>
<script src="aframe.min.js"></script>
<script src="mindar-image-aframe.prod.js"></script></head><body>
<div id="hint"><span>🌻 Pointez la caméra vers les deux cartes collées</span></div>
<video id="vid" src="video.mp4" muted playsinline webkit-playsinline preload="auto"></video>
<div id="err">Autorisez l’accès à la caméra pour scanner les cartes, puis rechargez la page.</div>
<a-scene mindar-image="imageTargetSrc: target.mind; filterMinCF:0.0001; filterBeta:0.001; uiScanning:no; uiLoading:no; uiError:no" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity id="t" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>
<script>
const v=document.getElementById('vid'),t=document.getElementById('t'),hint=document.getElementById('hint');
function show(on){v.style.display=on?'block':'none';hint.style.opacity=on?0:1;}
t.addEventListener('targetFound',()=>{if(v.style.display==='block')return;show(true);v.currentTime=0;v.play().catch(()=>{});});
t.addEventListener('targetLost',()=>{if(v.style.display!=='block')hint.style.opacity=1;});
v.addEventListener('ended',()=>show(false));
document.body.addEventListener('click',()=>{if(v.style.display==='block'&&v.paused)v.play().catch(()=>{});});
window.addEventListener('orientationchange',()=>{[300,800].forEach(d=>setTimeout(()=>window.dispatchEvent(new Event('resize')),d));});
document.querySelector('a-scene').addEventListener('arError',()=>{document.getElementById('err').style.display='flex';});
</script></body></html>
